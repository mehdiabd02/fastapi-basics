name: Build and Deploy Code
on:
  push:
    branches:
      - main
jobs:
  job1:
    environment: testing
    env:
      DATABASE_USER: ${{ secrets.DATABASE_USER }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
      DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
      DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
      # Use the Postgres service started by this job (append _test to DB name)
      DATABASE_URL: postgresql+psycopg2://postgres:${{ secrets.DATABASE_PASSWORD }}@localhost:5432/${{ secrets.DATABASE_NAME }}_test
      secret_key: ${{ secrets.SECRET_KEY }}
      access_token_expire_minutes: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
      algorithm: ${{ secrets.ALGORITHM }}
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: ${{ secrets.DATABASE_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DATABASE_NAME }}_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: pulling git repository
        uses: actions/checkout@v2
      - name: say hello
        run: echo "Hello, World!"
      - name: setup python
        uses: actions/setup-python@v2
        with:
          python-version: '3.13'
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Wait for Postgres service
        run: |
          until pg_isready -h localhost -p 5432; do
            sleep 1
          done
      - name: Create test database if missing
        env:
          PGPASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          psql -h localhost -U ${{ secrets.DATABASE_USER }} -tc "SELECT 1 FROM pg_database WHERE datname='${{ secrets.DATABASE_NAME }}_test'" | grep -q 1 || \
          psql -h localhost -U ${{ secrets.DATABASE_USER }} -c "CREATE DATABASE \"${{ secrets.DATABASE_NAME }}_test\";"
      - name: run tests
        run: |
          pip install pytest
          pytest tests/


    
      