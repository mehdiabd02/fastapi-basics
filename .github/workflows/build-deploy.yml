name: Build and Deploy Code
on:
  push:
    branches:
      - main
jobs:
  build:
    environment: testing
    env:
      DATABASE_USER: ${{ secrets.DATABASE_USER }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
      DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
      DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
      # Use the Postgres service started by this job (append _test to DB name)
      DATABASE_URL: postgresql+psycopg2://postgres:${{ secrets.DATABASE_PASSWORD }}@localhost:5432/${{ secrets.DATABASE_NAME }}_test
      secret_key: ${{ secrets.SECRET_KEY }}
      access_token_expire_minutes: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
      algorithm: ${{ secrets.ALGORITHM }}
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: ${{ secrets.DATABASE_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DATABASE_NAME }}_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: pulling git repository
        uses: actions/checkout@v2
      - name: say hello
        run: echo "Hello, World!"
      - name: setup python
        uses: actions/setup-python@v2
        with:
          python-version: '3.13'
      - name: Install system dependencies for psycopg2
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libpq-dev postgresql-client
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Wait for Postgres service
        run: |
          until pg_isready -h localhost -p 5432; do
            sleep 1
          done
      - name: Create test database if missing
        env:
          PGPASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          psql -h localhost -U ${{ secrets.DATABASE_USER }} -tc "SELECT 1 FROM pg_database WHERE datname='${{ secrets.DATABASE_NAME }}_test'" | grep -q 1 || \
          psql -h localhost -U ${{ secrets.DATABASE_USER }} -c "CREATE DATABASE \"${{ secrets.DATABASE_NAME }}_test\";"
      - name: run tests
        run: |
          pip install pytest
          pytest tests/

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/fastapi:latest

  deploy:
    needs: build
    environment: testing
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to production server (SSH)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "Logging into Docker Hub on remote"
            echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
            IMAGE=${{ secrets.DOCKER_HUB_USERNAME }}/fastapi:latest
            echo "Pulling image: $IMAGE"
            docker pull "$IMAGE"
            echo "Stopping existing container (if any)"
            docker stop fastapi || true
            docker rm fastapi || true
            echo "Starting container"
            docker run -d --name fastapi -p 80:8000 --restart unless-stopped \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
              -e ACCESS_TOKEN_EXPIRE_MINUTES="${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}" \
              -e ALGORITHM="${{ secrets.ALGORITHM }}" \
              "$IMAGE"
    
      