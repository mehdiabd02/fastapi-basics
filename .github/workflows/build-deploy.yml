name: Build and Deploy Code
on:
  push:
    branches:
      - main
jobs:
  job1:
    env:
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgresql
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: fastapi
      DATABASE_URL: postgresql+psycopg2://postgres:postgresql@localhost:5432/fastapi
      secret_key: 4lLC5oYOZWnSRlY6jzGwuE9qInKLu1ipqRN7hNI1Jtc
      access_token_expire_minutes: 300
      algorithm: HS256
      ALLOWED_ORIGINS: '["*"]'
    runs-on: ubuntu-latest
    steps:
      - name: pulling git repository
        uses: actions/checkout@v2
      - name: say hello
        run: echo "Hello, World!"
      - name: setup python
        uses: actions/setup-python@v2
        with:
          python-version: '3.13'
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: run tests
        run: |
          pip install pytest
          pytest tests/


    
      